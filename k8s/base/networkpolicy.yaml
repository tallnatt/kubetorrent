apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubetorrent-clients-netpol
  namespace: kubetorrent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubetorrent-clients
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: portal
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
