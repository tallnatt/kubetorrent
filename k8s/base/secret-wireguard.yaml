apiVersion: v1
kind: Secret
metadata:
  name: wireguard-config
  namespace: kubetorrent
type: Opaque
stringData:
  # Replace with the contents of your wg-proton.conf file, or generate via:
  # kubectl create secret generic wireguard-config --from-file=wg-proton.conf=./wg-proton.conf -n kubetorrent --dry-run=client -o yaml > k8s/base/secret-wireguard.yaml
  wg-proton.conf: |
    [Interface]
    PrivateKey = REPLACE_WITH_PRIVATE_KEY
    Address = 10.2.0.2/32
    DNS = 10.2.0.1

    [Peer]
    PublicKey = REPLACE_WITH_PEER_PUBLIC_KEY
    AllowedIPs = 0.0.0.0/0
    Endpoint = 198.51.100.1:51820
