apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubetorrent-portal
  namespace: kubetorrent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubetorrent-portal-provisioner
  namespace: kubetorrent
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubetorrent-portal-provisioner
  namespace: kubetorrent
subjects:
  - kind: ServiceAccount
    name: kubetorrent-portal
    namespace: kubetorrent
roleRef:
  kind: Role
  name: kubetorrent-portal-provisioner
  apiGroup: rbac.authorization.k8s.io
