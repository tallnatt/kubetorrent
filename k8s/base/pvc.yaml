apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubetorrent-portal-data
  namespace: kubetorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubetorrent-configs
  namespace: kubetorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
