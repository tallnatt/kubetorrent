apiVersion: v1
kind: Service
metadata:
  name: kubetorrent-portal
  namespace: kubetorrent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubetorrent-portal
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: kubetorrent-vpn-gateway
  namespace: kubetorrent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kubetorrent-vpn-gateway
  ports:
    - name: vxlan
      port: 4789
      targetPort: 4789
      protocol: UDP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
