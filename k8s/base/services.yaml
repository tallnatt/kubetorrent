apiVersion: v1
kind: Service
metadata:
  name: kubetorrent-portal
  namespace: kubetorrent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubetorrent-portal
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: kubetorrent-clients
  namespace: kubetorrent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubetorrent-clients
  ports:
    - name: webui-alice
      port: 8081
      targetPort: 8081
    - name: webui-bob
      port: 8082
      targetPort: 8082
