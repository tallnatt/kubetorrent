apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubetorrent-portal
  namespace: kubetorrent
  labels:
    app.kubernetes.io/name: kubetorrent-portal
    app.kubernetes.io/component: portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubetorrent-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubetorrent-portal
        app.kubernetes.io/component: portal
    spec:
      containers:
        - name: portal
          image: ghcr.io/tallnatt/kubetorrent-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kubetorrent-portal-config
            - secretRef:
                name: portal-secret
          volumeMounts:
            - name: portal-data
              mountPath: /data/portal
            - name: users-config
              mountPath: /etc/kubetorrent
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: portal-data
          persistentVolumeClaim:
            claimName: kubetorrent-portal-data
        - name: users-config
          configMap:
            name: kubetorrent-users
