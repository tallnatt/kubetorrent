apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: hostpath-patch.yaml

configMapGenerator:
  - name: kubetorrent-portal-config
    behavior: merge
    literals:
      - RP_ID=localhost
      - RP_ORIGINS=http://localhost:8080
      - COOKIE_SECURE=false
