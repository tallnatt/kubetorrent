name: Build and Push Portal

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - ".github/workflows/portal.yml"
  pull_request:
    paths:
      - "portal/**"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: portal/go.mod
      - run: go test -v ./...

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: portal
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubetorrent-portal:latest
            ghcr.io/${{ github.repository_owner }}/kubetorrent-portal:${{ github.sha }}
